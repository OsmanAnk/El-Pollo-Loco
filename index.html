    <script src="script.js"></script>

<body>
    <div class="start-screen" id="start-screen">
        <div class="start-screen-wrapper">
            <h1>El pollo loco</h1>
            <img src="assets/img/9_intro_outro_screens/start/startscreen_1.png" alt="startscreen"
                class="start-screen-image">
            <button class="start-button" onclick="startGame()">
                Start
            </button>
            <div class="sound-fullscreen-btn">
                <button class="fullscreen-button" onclick="toggleFullscreen()">
                    Fullscreen
                </button>
                <img src="assets/icons/lautstarke.png" alt="sound-on" class="sound-button" id="sound-btn" onclick="toggleSound()">
            </div>
            <button class="imprint-button" onclick="showImprint()">
                Imprint
            </button>

        </div>

    </div>
    <div class="game-container" id="game-container">
        <h1>El pollo loco</h1>
        <canvas id="canvas" width="720" height="480">
    </div>

    <div id="game-over-screen"></div>

    </canvas>
