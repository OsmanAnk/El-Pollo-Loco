<!DOCTYPE html>
<html lang="en">
<html translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js"></script>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/healthbar.class.js"></script>
    <script src="models/coinbar.class.js"></script>
    <script src="models/bottlebar.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/chick.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="levels.js/level1.js"></script>
    <script src="models/world.class.js"></script>
    <script src="js/game.js"></script>
</head>

<body>
    <div class="game-container" id="game-container">
        <h1>El pollo loco</h1>
        <canvas id="canvas" width="720" height="480"></canvas>
        <div class="action-btns">
            <img src="assets/icons/fullscreen.png" alt="fullscreen" class="fullscreen-button"
                id="fullscreen-btn" onclick="toggleFullscreen('game-container')"></img>
            <img src="assets/icons/lautstarke.png" alt="sound-on" class="sound-button" id="sound-btn"
                onclick="toggleSound(this)">
            <img src="assets/icons/keyboard.png" alt="keyboard binds" class="keyboard-binds" id="keyboard-binds"
                onclick="showControls()"></img>
        </div>
        <div class="start-screen" id="start-screen">
            <div class="start-screen-wrapper" id="start-screen-wrapper">
                <h1>El pollo loco</h1>
                <img src="assets/img/9_intro_outro_screens/start/startscreen_1.png" alt="startscreen"
                    class="start-screen-image">
                <button class="start-button" onclick="startGame()">
                    Start
                </button>
                <button class="imprint-button" onclick="showImprint()">
                    Imprint
                </button>
            </div>

        </div>
        <div class="end-screen d_none" id="end-screen">
        </div>
    </div>
        <div id="keyboard-controls-screen" class="keyboard-controls-screen d_none" onclick="showControls()">
            <div class="keyboard-controls-wrapper" onclick="event.stopPropagation()">
                <h2>Keyboard Controls</h2>
                <ul>
                    <li><strong>Move Left:</strong> Left Arrow</li>
                    <li><strong>Move Right:</strong> Right Arrow</li>
                    <li><strong>Jump:</strong> Up Arrow</li>
                    <li><strong>Throw Bottle:</strong> Spacebar</li>
                </ul>
                <button class="close-btn" onclick="closeModal()">Close</button>
            </div>
        </div>
        <div id="imprint-screen" class="imprint-screen d_none" onclick="hideImprint()">
            <div class="imprint-wrapper" onclick="event.stopPropagation()">
                <h2>Imprint</h2>
                <p>Game developed by Osman</p>
                <button class="close-btn" onclick="closeModal()">Close</button>
            </div>
        </div>
</body>

</html>
